# XcodeGen spec — generates R2be.xcodeproj (done for you by the GitHub Actions workflow).
name: R2be
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  R2be:
    type: application
    platform: iOS
    sources:
      - path: R2be
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.r2be   # Sideloadly rewrites this to your free-account ID
        TARGETED_DEVICE_FAMILY: "1"                       # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
    info:
      path: R2be/Info.plist
      properties:
        CFBundleDisplayName: R2be
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio            # keep playing with the screen locked / app in background
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: [R2beTests]
  R2beTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: R2beTests
    dependencies:
      - target: R2be
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.r2be.tests
        CODE_SIGNING_ALLOWED: NO
