name: Build unsigned IPA

# Builds on GitHub's free macOS runner so no Mac is needed. Sideloadly (Windows) signs the
# resulting .ipa with your free Apple ID when it installs it on your iPhone.
# Runs on pushes to main that change the app, and from Actions → Run workflow. macOS minutes cost
# 10x, so README-only pushes skip it, a newer push cancels a build still running, and a commit
# message containing [skip ci] skips it entirely.
on:
  push:
    branches: [main]
    paths: ["R2be/**", "project.yml", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1        # skip Homebrew's self-update; it adds a minute or more
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project R2be.xcodeproj \
            -scheme R2be \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:|warning: .*R2be|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          # Fail the job on a failed build; an empty R2be.app can exist even when compilation fails.
          [ "$status" -eq 0 ] || exit "$status"
          test -f build/Build/Products/Release-iphoneos/R2be.app/R2be

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/R2be.app Payload/
          zip -qry R2be.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: R2be-ipa
          path: R2be.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: xcodebuild.log
