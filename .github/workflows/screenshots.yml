name: Screenshots

# Manual. Builds a debug app for an iPhone simulator, loads the fake library from screenshots/demo
# (made by screenshots/make_demo.py), opens each screen in demo mode and uploads the screenshots.
on:
  workflow_dispatch:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  shoot:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          # An iPhone Pro on the newest iOS runtime.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devices if ".iOS-" in k), reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              pro = [d for d in phones if d["name"].endswith("Pro")]
              if phones:
                  print((pro or phones)[0]["udid"]); break
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Build
        run: |
          xcodebuild build -project R2be.xcodeproj -scheme R2be -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          [ "$status" -eq 0 ] || exit "$status"

      - name: Take screenshots
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/R2be.app
          data=$(xcrun simctl get_app_container "$UDID" com.example.r2be data)
          mkdir -p "$data/Documents" "$data/Library/Application Support"
          cp -R screenshots/demo "$data/Documents/demo"
          cp screenshots/demo/playlists.json "$data/Library/Application Support/playlists.json"
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --operatorName "" --batteryState charged --batteryLevel 100
          mkdir -p shots
          for screen in library player feed playlists; do
            xcrun simctl launch --terminate-running-process "$UDID" com.example.r2be -demoScreen "$screen"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$screen.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-build-log
          path: xcodebuild.log
